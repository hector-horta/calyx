[package]
name = "calyx-core"
version = "0.1.21"
edition = "2024"
authors = ["Hector Horta"]
license = "MIT"

[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
rusqlite = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
ctr = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
rodio = { workspace = true }
symphonia = { workspace = true }
kakasi = "0.1.0"
# Self-update: release archives are .zip (Windows) and .tar.gz (Linux/macOS).
# Both readers are built everywhere so the tests cover them on every OS.
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
dirs = { workspace = true }
