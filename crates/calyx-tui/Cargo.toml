[package]
name = "calyx-tui"
version = "0.1.25"
edition = "2024"
authors = ["Hector Horta"]
license = "MIT"

[[bin]]
name = "calyx"
path = "src/main.rs"

[dependencies]
calyx-core = { path = "../calyx-core" }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
image = { workspace = true }
tui-big-text = "0.7.1"
# OS media controls (SMTC / MPRIS / Now Playing). zbus: pure Rust D-Bus, no libdbus.
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }

[target.'cfg(windows)'.dependencies]
# Hidden window that SMTC is registered against (calyx is a console app).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader"] }
# Start Menu shortcut carrying calyx's app id (COM: IShellLinkW, IPropertyStore).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }

[target.'cfg(windows)'.build-dependencies]
# Name and icon embedded in calyx.exe (build.rs).
winresource = "0.1.34"
