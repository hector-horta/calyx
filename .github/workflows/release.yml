name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de la release (ej: v0.1.3). Si se deja vacio, se usa la version de Cargo.toml'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: calyx.exe
            asset_name: calyx-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: calyx
            asset_name: calyx-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: calyx
            asset_name: calyx-macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: calyx
            asset_name: calyx-macos-x86_64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux ALSA dependencies (if runner.os == 'Linux')
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package asset (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          mkdir stage
          Copy-Item "target/${{ matrix.target }}/release/calyx.exe" stage/
          Copy-Item "README.md" stage/
          Copy-Item "LICENSE" stage/
          if (Test-Path "assets") { Copy-Item -Recurse "assets" stage/ }
          Compress-Archive -Path "stage/*" -DestinationPath "${{ matrix.asset_name }}"

      - name: Package asset (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir stage
          cp "target/${{ matrix.target }}/release/calyx" stage/
          cp README.md stage/
          cp LICENSE stage/
          if [ -d "assets" ]; then cp -r assets stage/; fi
          tar -czvf "${{ matrix.asset_name }}" -C stage .

      - name: Determine Release Tag
        id: release_tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag_name }}"
          if (-not $tag -and "${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          }
          if (-not $tag) {
            $cargo = Get-Content Cargo.toml -Raw
            if ($cargo -match 'version\s*=\s*"([^"]+)"') {
              $tag = "v$($matches[1])"
            }
          }
          Write-Host "Resolved release tag: $tag"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: ${{ matrix.asset_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
