name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de la release (ej: v0.1.3). Si se deja vacio, se usa la version de Cargo.toml'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: calyx.exe
            asset_name: calyx-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: calyx
            asset_name: calyx-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: calyx
            asset_name: calyx-macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: calyx
            asset_name: calyx-macos-x86_64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        if: runner.os != 'Linux'
        run: cargo build --release --target ${{ matrix.target }}

      # A binary links against the glibc it was built with and refuses to run
      # on older ones, so build in Ubuntu 22.04 (glibc 2.35) instead of the
      # runner's own Ubuntu: it then runs on Debian 12, Ubuntu 22.04 and newer.
      - name: Build release binary (Linux, glibc 2.35)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD":/src -w /src ubuntu:22.04 bash -euc '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends               build-essential pkg-config libasound2-dev curl ca-certificates
            curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            cargo build --release --target ${{ matrix.target }}
          '
          echo "Newest glibc symbol needed:"
          objdump -T "target/${{ matrix.target }}/release/calyx" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

      - name: Package asset (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          mkdir stage
          Copy-Item "target/${{ matrix.target }}/release/calyx.exe" stage/
          Copy-Item "README.md" stage/
          Copy-Item "LICENSE" stage/
          Compress-Archive -Path "stage/*" -DestinationPath "${{ matrix.asset_name }}"
          $hash = (Get-FileHash "${{ matrix.asset_name }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset_name }}" | Out-File -FilePath "${{ matrix.asset_name }}.sha256" -Encoding ascii -NoNewline

      - name: Package asset (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir stage
          cp "target/${{ matrix.target }}/release/calyx" stage/
          cp README.md stage/
          cp LICENSE stage/
          tar -czvf "${{ matrix.asset_name }}" -C stage .
          shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"

      - name: Determine Release Tag
        id: release_tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag_name }}"
          if (-not $tag -and "${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          }
          if (-not $tag) {
            $cargo = Get-Content Cargo.toml -Raw
            if ($cargo -match 'version\s*=\s*"([^"]+)"') {
              $tag = "v$($matches[1])"
            }
          }
          Write-Host "Resolved release tag: $tag"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
