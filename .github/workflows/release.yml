name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: calyx.exe
            asset_name: calyx-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: calyx
            asset_name: calyx-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: calyx
            asset_name: calyx-macos-arm64.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            bin_name: calyx
            asset_name: calyx-macos-x86_64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux ALSA dependencies (if runner.os == 'Linux')
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package asset (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          mkdir stage
          Copy-Item "target/${{ matrix.target }}/release/calyx.exe" stage/
          Copy-Item "README.md" stage/
          Copy-Item "LICENSE" stage/
          if (Test-Path "assets") { Copy-Item -Recurse "assets" stage/ }
          Compress-Archive -Path "stage/*" -DestinationPath "${{ matrix.asset_name }}"

      - name: Package asset (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir stage
          cp "target/${{ matrix.target }}/release/calyx" stage/
          cp README.md stage/
          cp LICENSE stage/
          if [ -d "assets" ]; then cp -r assets stage/; fi
          tar -czvf "${{ matrix.asset_name }}" -C stage .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}